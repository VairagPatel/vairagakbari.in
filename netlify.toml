# Netlify Configuration for vairagakbari.in
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed - static HTML site
  publish = "dist"
  # Command to run before build (if needed)
  # command = ""

# Production context (main branch)
[context.production]
  publish = "dist"

# Deploy Preview context (PRs)
[context.deploy-preview]
  publish = "dist"

# Branch context (other branches)
[context.branch-deploy]
  publish = "dist"

# Redirect all 404s to custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Redirect www to non-www (optional - configure in Netlify UI instead)
# [[redirects]]
#   from = "https://www.vairagakbari.in/*"
#   to = "https://vairagakbari.in/:splat"
#   status = 301
#   force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # XSS Protection
    X-XSS-Protection = "1; mode=block"
    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy (formerly Feature-Policy)
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images with long expiry
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache PDF with long expiry
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS with long expiry
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages (to allow quick updates)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache fonts
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
